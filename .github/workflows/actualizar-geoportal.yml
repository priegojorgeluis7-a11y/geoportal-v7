name: Actualizar Geoportal V7 desde Google Sheets

on:
  # Se ejecuta cada hora
  schedule:
    - cron: '0 * * * *'
  # Se puede ejecutar manualmente desde GitHub
  workflow_dispatch:
  # Se ejecuta cuando hay push a main
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  actualizar-y-desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Forzar descarga LFS
        run: |
          git lfs pull
          ls -la "poligonos finales 16 y 17.gpkg"
          file "poligonos finales 16 y 17.gpkg"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generar geoportal desde Google Sheets
        run: |
          python generate_geoportal_v7_ci.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'geoportal_v7'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
